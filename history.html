<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Historique — KENXCHANGE</title>
  <meta name="description" content="Historique des demandes d'échange (prototype)">
  <base href="/KENXCHANGE-/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body{font-family:Inter,system-ui,Arial;margin:0;background:#f7f8fb;color:#111}
    .container{max-width:1100px;margin:2rem auto;padding:0 1rem}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
    th,td{padding:.75rem;border-bottom:1px solid #eef2f7;text-align:left}
    th{background:#f5f7fb}
    .status{padding:.25rem .5rem;border-radius:6px;font-size:.9rem}
    .status.pending{background:#fff4e6;color:#b45f00}
    .status.completed{background:#e6ffef;color:#12633a}
    .status.cancelled{background:#ffe6e6;color:#8b1c1c}
    @media(max-width:800px){table,thead,tbody,th,td,tr{display:block}thead{display:none}td{border-bottom:none;padding:.5rem 0}}
  </style>
</head>
<body>
  <header style="background:#0b5cff;color:#fff;padding:1rem 0"><div class="container"><strong>KENXCHANGE</strong> — Historique</div></header>
  <main class="container">
    <section style="margin-top:1rem">
      <p>Liste des demandes d'échange (données fictives pour le prototype).</p>
      <table>
        <thead>
          <tr><th>Numéro</th><th>Utilisateur</th><th>De</th><th>Vers</th><th>Montant</th><th>Taux</th><th>Date</th><th>Statut</th></tr>
        </thead>
        <tbody id="historyBody">
        </tbody>
      </table>
    </section>
  </main>
  <footer style="text-align:center;padding:2rem 0;color:#666">© KENXCHANGE</footer>

  <script>
    // Demo operations
    const demoOps = [
      {id:101,user:'alice',from:'USD',to:'EUR',amount:200,taux:0.92,date:'2026-09-01',status:'completed'},
      {id:102,user:'bob',from:'EUR',to:'USDT',amount:150,taux:1.08,date:'2026-09-06',status:'pending'},
      {id:103,user:'charlie',from:'USDT',to:'XOF',amount:300,taux:610,date:'2026-09-08',status:'completed'},
      {id:104,user:'dan',from:'USD',to:'USDT',amount:50,taux:1,date:'2026-09-10',status:'cancelled'}
    ];

    function renderHistory(){
      const body = document.getElementById('historyBody');
      body.innerHTML = '';
      demoOps.forEach(op=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${op.id}</td><td>${op.user}</td><td>${op.from}</td><td>${op.to}</td><td>${op.amount} ${op.from}</td><td>${op.taux}</td><td>${op.date}</td><td><span class="status ${op.status=='pending'?'pending':op.status=='completed'?'completed':'cancelled'}">${op.status}</span></td>`;
        body.appendChild(tr);
      })
    }
    renderHistory();
  </script>
</body>
</html>
